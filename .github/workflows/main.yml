name: Deploy to Google Cloud Functions

# ทำงานทุกครั้งที่มีการกด Push โค้ดเข้า branch 'main'
on:
  push:
    branches: [ main ]

env:
  # กำหนดตัวแปรสภาพแวดล้อม
  REGION: asia-southeast1
  FUNCTION_NAME: ai-cargo-safety-fn  # ชื่อฟังก์ชันที่จะแสดงบน Google Cloud

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. ดึงโค้ดล่าสุดจาก Repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. ยืนยันตัวตนกับ Google Cloud ด้วยไฟล์ JSON Key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. สั่ง Deploy ขึ้น Cloud Functions โดยตรง (ไม่ต้อง Build Docker)
      - name: 'Deploy to Cloud Functions'
        uses: 'google-github-actions/deploy-cloud-functions@v2'
        with:
          name: ${{ env.FUNCTION_NAME }}
          runtime: 'python311'           # ใช้ Python เวอร์ชัน 3.11
          region: ${{ env.REGION }}      # โซนเดียวกับที่ระบุใน env
          source_dir: '.'                # ดึงโค้ดจากโฟลเดอร์หลัก
          entry_point: 'process_request' # ชื่อฟังก์ชันหลักในไฟล์ main.py ของคุณ
          env_vars: 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEYS }}'
          memory_mb: 2048                # กำหนด RAM 2GB เพื่อให้ประมวลผลรูปภาพได้ราบรื่น
